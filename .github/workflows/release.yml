name: Build and release ReadDraw

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布标签，须与 readdraw/version.py 中的版本一致（如 v0.2.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Test application
        run: python -m unittest discover -s tests -v

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Build Windows package
        shell: powershell
        run: .\build_windows.ps1 -Version $env:RELEASE_VERSION -RequireInstaller

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/ReadDraw.exe
            release/ReadDraw-Setup.exe
            release/ReadDraw.exe.sha256
            release/update.json
